openapi: 3.1.0
info:
  title: Food delivery platform API
  version: 0.1.0
  description: |
    Phase 1 contract. Only routes that exist and are tested appear here; a
    test fails if this document and the registered routes differ.

    Browser clients authenticate with a session cookie that is specific to
    the app they are served from (customer, merchant or admin), identified by
    the request's Origin header. Every state-changing request must carry the
    token from `GET /api/v1/auth/csrf` in the `X-CSRF-TOKEN` header.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Rider
  - name: Geography
  - name: Admin
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness
      description: Touches no dependency. Public.
      operationId: healthLive
      security: []
      responses:
        "200":
          description: The process is serving requests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness
      description: Reports dependency state. Answers only to loopback and private network addresses; anyone else receives 404.
      operationId: healthReady
      security: []
      responses:
        "200":
          description: Every dependency is reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: At least one dependency is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "404":
          description: Caller is not on an internal network.
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      summary: Get the CSRF token for this app's session
      operationId: authCsrf
      security: []
      responses:
        "200":
          description: Token bound to the caller's session.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [csrf_token]
                    properties:
                      csrf_token: { type: string }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a customer
      description: |
        Available only from the customer app and only when public
        registration is switched on; otherwise 404. Always creates a
        customer: any role, scope or status in the request is ignored. The
        answer is the same whether or not the address was already registered.
      operationId: authRegister
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 10, maxLength: 1024, format: password }
      responses:
        "202":
          description: Registration received.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status: { type: string, const: registration_received }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: |
        Starts a session on the calling app. A wrong password, an unknown
        account, a suspended account and an account not entitled to this app
        all produce the same 401. Five failures for one account from one
        address within a minute produce 429. The admin app refuses sign-in in
        production until two-step verification exists.
      operationId: authLogin
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 1024, format: password }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUserResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Ask for a password reset link
      description: |
        Always answers 202 with the same body, whether or not the address
        belongs to an account. If it does, and the account is active, an
        email is sent with a link that works once and expires after 60
        minutes; a newer request cancels an older link. At most three emails
        are sent per address in 15 minutes.
      operationId: authPasswordForgot
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 255 }
      responses:
        "202":
          description: Request received.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status: { type: string, const: reset_requested }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Set a new password with a reset link's token
      description: |
        An unknown, used or expired token gives one 422 with the same
        message. On success the token is consumed; the user is not signed in.
      operationId: authPasswordReset
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 200 }
                password: { type: string, minLength: 10, maxLength: 1024, format: password }
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status: { type: string, const: password_reset }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/mobile/token:
    post:
      tags: [Rider]
      summary: Sign in from the rider app
      description: |
        Issues a bearer token for an approved rider on a named device. The
        token carries only the `rider:profile` ability and expires after 60
        minutes. A wrong password, an unknown address, a customer, a rider who
        is not approved and a suspended account all get the same 401. Five
        failures for one account from one address within a minute give 429.
        Send no Origin header; this endpoint is not for browsers.
      operationId: authMobileToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name, platform]
              properties:
                email: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 1024, format: password }
                device_name: { type: string, minLength: 1, maxLength: 120 }
                platform: { type: string, enum: [android] }
      responses:
        "201":
          description: Token issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderTokenResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Rider]
      summary: Sign out of the rider app
      description: Deletes the token and marks its device revoked.
      operationId: authMobileRevoke
      security:
        - riderToken: []
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/mobile/token/refresh:
    post:
      tags: [Rider]
      summary: Swap a valid token for a new one
      description: |
        The old token is deleted as the new one is issued, on the same device.
        An expired token cannot be refreshed; the rider signs in again.
      operationId: authMobileRefresh
      security:
        - riderToken: []
      responses:
        "201":
          description: New token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderTokenResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/rider/me:
    get:
      tags: [Rider]
      summary: The signed-in rider's own profile
      description: Refused if the rider is no longer approved, the account is suspended or the device was revoked.
      operationId: riderMe
      security:
        - riderToken: []
      responses:
        "200":
          description: Rider profile.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/RiderProfile" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      operationId: authLogout
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: Session ended. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      description: Lists live role grants only. Contains no secret fields.
      operationId: meShow
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUserResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/public/config:
    get:
      tags: [Geography]
      summary: Deployment settings any client may read
      description: |
        No sign-in needed and nothing secret. `service_open` is true only when
        an active zone exists in an active city. `map_style_url` is null until
        a licensed map style is configured. Every feature flag is off by
        default; in Phase 1 the later-phase flags change nothing when on.
      operationId: publicConfig
      security: []
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [currency, display_timezone, service_open, map_style_url, features]
                    properties:
                      currency: { type: string, description: ISO 4217 code. One per deployment. }
                      display_timezone: { type: string, description: For screens with no city. Each city has its own. }
                      service_open: { type: boolean }
                      map_style_url: { type: [string, "null"], format: uri }
                      features:
                        type: object
                        additionalProperties: false
                        required: [public_registration, live_dispatch, online_payments, rider_tracking]
                        properties:
                          public_registration: { type: boolean }
                          live_dispatch: { type: boolean }
                          online_payments: { type: boolean }
                          rider_tracking: { type: boolean }
                  meta: { $ref: "#/components/schemas/Meta" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/public/cities:
    get:
      tags: [Geography]
      summary: Cities where the service is open
      description: Active cities only. Empty until a city has been activated.
      operationId: publicCities
      security: []
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page of active cities, sorted by id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PublicCity" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/locations/serviceability:
    post:
      tags: [Geography]
      summary: Can this point be delivered to?
      description: |
        Polygon containment only: it does not check that a route exists. A
        point on a zone boundary is inside. `NO_ACTIVE_ZONE` means nothing is
        open anywhere; `OUTSIDE_COVERAGE` means zones exist but none covers
        the point. Limited to 60 requests a minute per address.

        This is a POST although it changes nothing: the position is personal
        data, and a query string is written to access logs by servers and
        proxies. A position sent in the URL is refused with 422, and the
        position is neither stored nor logged by the API (ADR-013). Browser
        clients send the usual `X-CSRF-TOKEN` header.
      operationId: serviceability
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [latitude, longitude]
              properties:
                latitude:
                  oneOf:
                    - { type: string, pattern: '^-?\d{1,3}(\.\d{1,12})?$' }
                    - { type: number, minimum: -90, maximum: 90 }
                  description: Decimal degrees, -90 to 90.
                longitude:
                  oneOf:
                    - { type: string, pattern: '^-?\d{1,3}(\.\d{1,12})?$' }
                    - { type: number, minimum: -180, maximum: 180 }
                  description: Decimal degrees, -180 to 180.
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Serviceability" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/admin/cities:
    get:
      tags: [Admin]
      summary: List cities the caller may read
      description: Admin app only. Filtered to the caller's scope; needs `cities.read`.
      operationId: adminCitiesIndex
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CityStatus" }
      responses:
        "200":
          description: One page of cities, sorted by id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/City" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      summary: Create a city
      description: Needs `cities.write` with global scope. The city starts as a draft; `status` and `id` in the request are ignored.
      operationId: adminCitiesStore
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, country_code, currency_code, timezone]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                slug: { type: string, maxLength: 160, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
                country_code: { type: string, pattern: "^[A-Z]{2}$" }
                currency_code: { type: string, description: Must equal the deployment currency. }
                timezone: { type: string, description: IANA name. Required; never defaulted. }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/cities/{city}:
    parameters:
      - name: city
        in: path
        required: true
        schema: { type: string }
        description: City id. Letter case is ignored.
    get:
      tags: [Admin]
      summary: One city
      description: 404 if it does not exist or the caller may not read it.
      operationId: adminCitiesShow
      responses:
        "200":
          description: The city.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Admin]
      summary: Edit a city or move its status
      description: |
        Needs `cities.write`. Only `name`, `timezone` and `status` can change.
        Status moves along: draft to active or archived; active to paused;
        paused to active or archived. Anything else, or any change to an
        archived city, is 409.
      operationId: adminCitiesUpdate
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                timezone: { type: string }
                status: { $ref: "#/components/schemas/CityStatus" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/cities/{city}/zones:
    parameters:
      - name: city
        in: path
        required: true
        schema: { type: string }
        description: City id. Letter case is ignored.
    get:
      tags: [Admin]
      summary: List a city's delivery zones
      description: Needs `zones.read` for the city; 404 otherwise. Geometry is left out of lists.
      operationId: adminZonesIndex
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page of zones, sorted by id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Zone" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      summary: Create a delivery zone
      description: |
        Needs `zones.write` for the city. The zone starts as a draft at
        version 1; `status`, `version` and `id` in the request are ignored.
        Geometry is checked for structure, the vertex and extent caps, and
        then by PostGIS for self-intersection. 409 if the city is archived.
      operationId: adminZonesStore
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, geometry]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                slug: { type: string, maxLength: 160, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", description: Unique within the city. }
                priority: { type: integer, minimum: -1000, maximum: 1000, default: 0 }
                geometry: { $ref: "#/components/schemas/ZoneGeometryInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/zones/{zone}:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
        description: Zone id. Letter case is ignored.
    get:
      tags: [Admin]
      summary: One delivery zone, with its geometry
      description: 404 if it does not exist or the caller may not read its city.
      operationId: adminZonesShow
      responses:
        "200":
          description: The zone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Admin]
      summary: Edit a delivery zone
      description: |
        Needs `zones.write` for the zone's city. Send the `version` you
        loaded; if the zone has changed since, the edit is refused with 409
        and nothing is written. Only `name`, `priority` and `geometry` can
        change; each successful edit adds 1 to `version`. Status has its own
        routes. Any change to an archived zone is 409.
      operationId: adminZonesUpdate
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                name: { type: string, minLength: 1, maxLength: 160 }
                priority: { type: integer, minimum: -1000, maximum: 1000 }
                geometry: { $ref: "#/components/schemas/ZoneGeometryInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/zones/{zone}/activate:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
        description: Zone id. Letter case is ignored.
    post:
      tags: [Admin]
      summary: Put a delivery zone live
      description: |
        Needs `zones.write` for the zone's city. Allowed from draft or paused,
        only while the city is active, and only with `confirm: true`. 409 for
        any other status, an inactive city or a stale `version`.
      operationId: adminZonesActivate
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, confirm]
              properties:
                version: { type: integer, minimum: 1 }
                confirm: { type: boolean, enum: [true] }
      responses:
        "200":
          description: The zone in its new status; `version` has gone up by 1.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/zones/{zone}/pause:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
        description: Zone id. Letter case is ignored.
    post:
      tags: [Admin]
      summary: Pause an active delivery zone
      description: |
        Needs `zones.write` for the zone's city. Allowed from active only; a
        reason is required. 409 for any other status or a stale `version`.
      operationId: adminZonesPause
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 255, description: Kept in the audit log. }
      responses:
        "200":
          description: The zone in its new status; `version` has gone up by 1.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/zones/{zone}/archive:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
        description: Zone id. Letter case is ignored.
    post:
      tags: [Admin]
      summary: Archive a delivery zone
      description: |
        Needs `zones.write` for the zone's city. Allowed from draft or paused;
        an active zone must be paused first. Archiving is final. 409 for any
        other status or a stale `version`.
      operationId: adminZonesArchive
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 255, description: Kept in the audit log. }
      responses:
        "200":
          description: The zone in its new status; `version` has gone up by 1.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/zones/{zone}/exclusions:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
        description: Zone id. Letter case is ignored.
    get:
      tags: [Admin]
      summary: List a zone's coverage exclusions
      description: Needs `zones.read` for the zone's city; 404 otherwise. Includes exclusions whose window has ended or not started.
      operationId: adminExclusionsIndex
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page of exclusions, sorted by id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Exclusion" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      summary: Exclude an area from a zone
      description: |
        Needs `zones.write` for the zone's city. Points inside the shape,
        its boundary included, stop being serviceable while the exclusion is
        in force: from `active_from` (or at once) until `active_until` (or
        until it is deleted). The shape gets the same checks as a zone and
        must overlap the zone. Exclusions are not edited: delete and add.
        409 if the zone is archived.
      operationId: adminExclusionsStore
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, geometry]
              properties:
                reason: { type: string, minLength: 1, maxLength: 255 }
                geometry: { $ref: "#/components/schemas/ZoneGeometryInput" }
                active_from: { type: [string, "null"], format: date-time, description: With an offset or Z. Stored in UTC. }
                active_until: { type: [string, "null"], format: date-time, description: Must be after `active_from`. }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Exclusion" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/exclusions/{exclusion}:
    parameters:
      - name: exclusion
        in: path
        required: true
        schema: { type: string }
        description: Exclusion id. Letter case is ignored.
    delete:
      tags: [Admin]
      summary: Remove a coverage exclusion
      description: Needs `zones.write` for the city of the exclusion's zone. The removal is audited with the reason and window.
      operationId: adminExclusionsDestroy
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/audit-logs:
    get:
      tags: [Admin]
      summary: Audit trail, newest first
      description: |
        Needs `audit.read`. Staff holding it everywhere see every entry;
        staff holding it for certain cities see only entries tied to those
        cities. Sensitive values in `before` and `after` are redacted, and
        the address hash is never returned.
      operationId: adminAuditLogsIndex
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: action, in: query, schema: { type: string, maxLength: 120 }, description: Exact match. }
        - { name: subject_type, in: query, schema: { type: string, maxLength: 80 } }
        - { name: subject_id, in: query, schema: { type: string } }
        - { name: actor_user_id, in: query, schema: { type: string } }
        - { name: city_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/system/status:
    get:
      tags: [Admin]
      summary: Deployment status summary
      description: |
        Needs `system.status.read` with global scope. Dependency checks are
        up or down only. No secret, host name or connection detail is
        returned.
      operationId: adminSystemStatus
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [environment, debug, checks, postgis, cities, zones, features, map_style_configured, geometry_caps_approved]
                    properties:
                      environment: { type: string }
                      debug: { type: boolean, description: Must be false in production. }
                      checks:
                        type: object
                        additionalProperties: false
                        required: [database, redis]
                        properties:
                          database: { type: boolean }
                          redis: { type: boolean }
                      postgis: { type: boolean }
                      cities:
                        type: object
                        additionalProperties: false
                        required: [draft, active, paused, archived]
                        properties:
                          draft: { type: integer }
                          active: { type: integer }
                          paused: { type: integer }
                          archived: { type: integer }
                      zones:
                        type: object
                        additionalProperties: false
                        required: [draft, active, paused, archived]
                        properties:
                          draft: { type: integer }
                          active: { type: integer }
                          paused: { type: integer }
                          archived: { type: integer }
                      features:
                        type: object
                        additionalProperties: { type: boolean }
                      map_style_configured: { type: boolean }
                      geometry_caps_approved: { type: boolean }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
security:
  - sessionCookie: []
components:
  securitySchemes:
    riderToken:
      type: http
      scheme: bearer
      description: Rider app token from `POST /api/v1/auth/mobile/token`. Never valid on browser or admin routes.
    sessionCookie:
      type: apiKey
      in: cookie
      name: fd_customer_session
      description: The cookie is `fd_customer_session`, `fd_merchant_session` or `fd_admin_session` depending on the calling app.
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque value from `meta.next_cursor` of the previous page.
  headers:
    RequestId:
      description: Identifier of this request, also present in the body.
      schema: { type: string }
  responses:
    Error:
      description: Error envelope.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    RiderToken:
      type: object
      additionalProperties: false
      required: [token, token_type, abilities, expires_at]
      properties:
        token: { type: string, description: Shown once. Store it in the device keystore. }
        token_type: { type: string, const: Bearer }
        abilities:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }
    RiderTokenResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/RiderToken" }
        meta: { $ref: "#/components/schemas/Meta" }
    RiderProfile:
      type: object
      additionalProperties: false
      required: [id, user_id, name, email, status, approved_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [approved] }
        approved_at: { type: [string, "null"], format: date-time }
    PageMeta:
      type: object
      additionalProperties: false
      required: [request_id, next_cursor]
      properties:
        request_id: { type: string }
        next_cursor: { type: [string, "null"] }
    CityStatus:
      type: string
      enum: [draft, active, paused, archived]
    City:
      type: object
      additionalProperties: false
      required: [id, slug, name, country_code, currency_code, timezone, status, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^[0-9a-z]{26}$" }
        slug: { type: string }
        name: { type: string }
        country_code: { type: string }
        currency_code: { type: string }
        timezone: { type: string }
        status: { $ref: "#/components/schemas/CityStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CityResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/City" }
        meta: { $ref: "#/components/schemas/Meta" }
    ZoneGeometryInput:
      type: object
      required: [type, coordinates]
      description: GeoJSON Polygon or MultiPolygon, positions as [longitude, latitude]. Caps from config/geo.php.
      properties:
        type: { type: string, enum: [Polygon, MultiPolygon] }
        coordinates: { type: array, items: {} }
    Zone:
      type: object
      additionalProperties: false
      required: [id, city_id, name, slug, status, priority, version, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^[0-9a-z]{26}$" }
        city_id: { type: string, pattern: "^[0-9a-z]{26}$" }
        name: { type: string }
        slug: { type: string }
        status: { $ref: "#/components/schemas/CityStatus" }
        priority: { type: integer }
        version: { type: integer, minimum: 1 }
        geometry:
          type: object
          description: GeoJSON MultiPolygon. Present on single-zone responses only.
          required: [type, coordinates]
          properties:
            type: { type: string, enum: [MultiPolygon] }
            coordinates: { type: array, items: {} }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ZoneResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Zone" }
        meta: { $ref: "#/components/schemas/Meta" }
    Exclusion:
      type: object
      additionalProperties: false
      required: [id, zone_id, reason, active_from, active_until, geometry, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^[0-9a-z]{26}$" }
        zone_id: { type: string, pattern: "^[0-9a-z]{26}$" }
        reason: { type: string }
        active_from: { type: [string, "null"], format: date-time }
        active_until: { type: [string, "null"], format: date-time }
        geometry:
          type: object
          description: GeoJSON MultiPolygon.
          required: [type, coordinates]
          properties:
            type: { type: string, enum: [MultiPolygon] }
            coordinates: { type: array, items: {} }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, actor_user_id, action, subject_type, subject_id, city_id, before, after, correlation_id, created_at]
      properties:
        id: { type: string }
        actor_user_id: { type: [string, "null"], description: Null for actions taken by the system. }
        action: { type: string }
        subject_type: { type: string }
        subject_id: { type: [string, "null"] }
        city_id: { type: [string, "null"] }
        before: { type: [object, "null"] }
        after: { type: [object, "null"] }
        correlation_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    PublicCity:
      type: object
      additionalProperties: false
      required: [id, name, country_code, currency_code, timezone]
      properties:
        id: { type: string }
        name: { type: string }
        country_code: { type: string }
        currency_code: { type: string }
        timezone: { type: string }
    NamedRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Serviceability:
      type: object
      additionalProperties: false
      required: [serviceable, reason, city, zone]
      properties:
        serviceable: { type: boolean }
        reason: { type: [string, "null"], enum: [NO_ACTIVE_ZONE, OUTSIDE_COVERAGE, null] }
        city:
          oneOf: [{ $ref: "#/components/schemas/NamedRef" }, { type: "null" }]
        zone:
          oneOf: [{ $ref: "#/components/schemas/NamedRef" }, { type: "null" }]
    Meta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: { type: string }
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, unavailable] }
        checks:
          type: object
          additionalProperties: false
          required: [database, redis]
          properties:
            database: { type: boolean }
            redis: { type: boolean }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, AUTH_REQUIRED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, RATE_LIMITED, PROVIDER_UNAVAILABLE, BAD_REQUEST, SERVER_ERROR]
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            request_id: { type: string }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, name, email, email_verified, surface, grants]
      properties:
        id: { type: string, pattern: "^[0-9a-z]{26}$" }
        name: { type: string }
        email: { type: string }
        email_verified: { type: boolean }
        surface: { type: string, enum: [customer, merchant, admin] }
        grants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, scope_type, scope_id, permissions]
            properties:
              role: { type: string }
              scope_type: { type: string, enum: [global, city, merchant, branch] }
              scope_id: { type: [string, "null"] }
              permissions:
                type: array
                items: { type: string }
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/CurrentUser" }
        meta: { $ref: "#/components/schemas/Meta" }
