openapi: 3.1.0
info:
  title: Food delivery platform API
  version: 0.1.0
  description: |
    Phase 1 contract. Only routes that exist and are tested appear here; a
    test fails if this document and the registered routes differ.

    Browser clients authenticate with a session cookie that is specific to
    the app they are served from (customer, merchant or admin), identified by
    the request's Origin header. Every state-changing request must carry the
    token from `GET /api/v1/auth/csrf` in the `X-CSRF-TOKEN` header.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Rider
  - name: Geography
  - name: Admin
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness
      description: Touches no dependency. Public.
      operationId: healthLive
      security: []
      responses:
        "200":
          description: The process is serving requests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness
      description: Reports dependency state. Answers only to loopback and private network addresses; anyone else receives 404.
      operationId: healthReady
      security: []
      responses:
        "200":
          description: Every dependency is reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: At least one dependency is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "404":
          description: Caller is not on an internal network.
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      summary: Get the CSRF token for this app's session
      operationId: authCsrf
      security: []
      responses:
        "200":
          description: Token bound to the caller's session.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [csrf_token]
                    properties:
                      csrf_token: { type: string }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a customer
      description: |
        Available only from the customer app and only when public
        registration is switched on; otherwise 404. Always creates a
        customer: any role, scope or status in the request is ignored. The
        answer is the same whether or not the address was already registered.
      operationId: authRegister
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 10, maxLength: 1024, format: password }
      responses:
        "202":
          description: Registration received.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status: { type: string, const: registration_received }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: |
        Starts a session on the calling app. A wrong password, an unknown
        account, a suspended account and an account not entitled to this app
        all produce the same 401. Five failures for one account from one
        address within a minute produce 429. On the admin app, staff with a
        confirmed second factor are not signed in by a correct password: the
        answer is `{"data":{"mfa_required":true}}` and `POST /auth/mfa/verify`
        finishes sign-in. In deployed environments, staff without a second
        factor get an enrolment-only session (see `POST /me/mfa/totp`).
      operationId: authLogin
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 1024, format: password }
      responses:
        "200":
          description: Signed in, or a second step is required.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/CurrentUserResponse" }
                  - { $ref: "#/components/schemas/MfaRequiredResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Finish staff sign-in with the second step
      description: |
        Admin app only. Follows a login that answered `mfa_required`. Send a
        six-digit `code` from the authenticator app or one `recovery_code`.
        A code works once; so does a recovery code. A wrong code, an expired
        pending sign-in (5 minutes) and a missing one all produce the same 401.
        Five failures for one account from one address within a minute produce
        429. On success it answers like login.
      operationId: authMfaVerify
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, maxLength: 64 }
                recovery_code: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUserResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/me/mfa/totp:
    post:
      tags: [Auth]
      summary: Start two-step sign-in setup
      description: |
        Admin app only. Creates an unconfirmed authenticator secret and returns
        it once, with an otpauth URI for a QR code. Calling again before
        confirming replaces the secret. Once confirmed, 409. In deployed
        environments a staff session without a confirmed second factor may call
        only this, the confirm route and logout; everything else answers 403.
      operationId: meMfaTotpStart
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "201":
          description: Setup started.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [secret, otpauth_uri]
                    properties:
                      secret: { type: string, pattern: "^[A-Z2-7]{32}$" }
                      otpauth_uri: { type: string }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/me/mfa/totp/confirm:
    post:
      tags: [Auth]
      summary: Confirm two-step sign-in setup
      description: |
        Admin app only. Send a current code from the authenticator app. Returns
        ten single-use recovery codes, once; they are stored only as hashes.
        In deployed environments the session ends afterwards and the person
        signs in again with the second step. Five failures in a minute produce 429.
      operationId: meMfaTotpConfirm
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [recovery_codes]
                    properties:
                      recovery_codes:
                        type: array
                        minItems: 10
                        maxItems: 10
                        items: { type: string }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/me/mfa/recovery-codes:
    post:
      tags: [Auth]
      summary: Replace the recovery codes
      description: |
        Admin app only, for staff with a confirmed second factor. Send a
        current 6-digit code from the authenticator app (one that has not
        been used yet). Returns ten new single-use recovery codes, once, and
        invalidates every old one. A wrong code is 422, like confirming
        setup; five failures in a minute produce 429. 409 when no second
        factor is set up. The audit row `auth.mfa_recovery_codes_regenerated`
        holds no code.
      operationId: meMfaRecoveryCodesRegenerate
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 64 }
      responses:
        "200":
          description: New codes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [recovery_codes]
                    properties:
                      recovery_codes:
                        type: array
                        minItems: 10
                        maxItems: 10
                        items: { type: string }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Ask for a password reset link
      description: |
        Always answers 202 with the same body, whether or not the address
        belongs to an account. If it does, and the account is active, an
        email is sent with a link that works once and expires after 60
        minutes; a newer request cancels an older link. At most three emails
        are sent per address in 15 minutes.
      operationId: authPasswordForgot
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 255 }
      responses:
        "202":
          description: Request received.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status: { type: string, const: reset_requested }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Set a new password with a reset link's token
      description: |
        An unknown, used or expired token gives one 422 with the same
        message. On success the token is consumed. Existing browser sessions
        are rejected on their next protected request. The user must sign in
        with the new password.
      operationId: authPasswordReset
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 200 }
                password: { type: string, minLength: 10, maxLength: 1024, format: password }
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status: { type: string, const: password_reset }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/invitations/inspect:
    post:
      tags: [Auth]
      summary: Look at a staff invitation before accepting it
      description: |
        Public; admin app only. The emailed token goes in the body, never in
        a URL (the link carries it in the fragment). Shows only the invitee's
        name, the role label, a place label and the expiry. An unknown, used,
        revoked or expired token all give the same 404. Looking does not use
        the invitation up.
      operationId: authInvitationsInspect
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 200 }
      responses:
        "200":
          description: A live invitation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/InvitationPreview" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/invitations/accept:
    post:
      tags: [Auth]
      summary: Accept a staff invitation
      description: |
        Public; admin app only. In one transaction: the account is created
        (or, when the address already has one, the role is attached to it),
        the role is granted through the same audited path as `POST
        /admin/users/{user}/roles` with the inviter as grantor, and the
        invitation is marked used. The password is the new account's
        password (at least 10 characters). When the address already has an
        account it must be that account's current password, which is not
        changed; this is never revealed in any response. Anything that fails
        (unknown, used, revoked or expired token, wrong password for an
        existing account, an inviter who no longer has the right, an inactive
        account, a role already held) gives the same 404. Five failures per
        token in 15 minutes give 429. Nobody is signed in: sign in as usual;
        in deployed environments the admin console then needs two-step
        sign-in set up first (ADR-011).
      operationId: authInvitationsAccept
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 200 }
                password: { type: string, minLength: 10, maxLength: 1024, format: password }
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status: { type: string, const: invitation_accepted }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/mobile/token:
    post:
      tags: [Rider]
      summary: Sign in from the rider app
      description: |
        Issues a bearer token for an approved rider on a named device. The
        token carries only the `rider:profile` ability and expires after 60
        minutes. A wrong password, an unknown address, a customer, a rider who
        is not approved and a suspended account all get the same 401. Five
        failures for one account from one address within a minute give 429.
        Send no Origin header; this endpoint is not for browsers.
      operationId: authMobileToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name, platform]
              properties:
                email: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 1024, format: password }
                device_name: { type: string, minLength: 1, maxLength: 120 }
                platform: { type: string, enum: [android] }
      responses:
        "201":
          description: Token issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderTokenResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Rider]
      summary: Sign out of the rider app
      description: Deletes the token and marks its device revoked.
      operationId: authMobileRevoke
      security:
        - riderToken: []
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/mobile/token/refresh:
    post:
      tags: [Rider]
      summary: Swap a valid token for a new one
      description: |
        The old token is deleted as the new one is issued, on the same device.
        An expired token cannot be refreshed; the rider signs in again.
        One sign-in lasts at most 30 days from when the device signed in:
        refreshing never goes past that, the last token's `expires_at` stops
        at it, and after it refresh answers 401 and the device is revoked.
      operationId: authMobileRefresh
      security:
        - riderToken: []
      responses:
        "201":
          description: New token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderTokenResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/rider/me:
    get:
      tags: [Rider]
      summary: The signed-in rider's own profile
      description: Refused if the rider is no longer approved, the account is suspended or the device was revoked.
      operationId: riderMe
      security:
        - riderToken: []
      responses:
        "200":
          description: Rider profile.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/RiderProfile" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      operationId: authLogout
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: Session ended. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      description: Lists live role grants only. Contains no secret fields.
      operationId: meShow
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUserResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/public/config:
    get:
      tags: [Geography]
      summary: Deployment settings any client may read
      description: |
        No sign-in needed and nothing secret. `service_open` is true only when
        an active zone exists in an active city. `map_style_url` is null until
        a licensed map style is configured. Every feature flag is off by
        default; in Phase 1 the later-phase flags change nothing when on.
      operationId: publicConfig
      security: []
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [currency, display_timezone, service_open, map_style_url, features]
                    properties:
                      currency: { type: string, description: ISO 4217 code. One per deployment. }
                      display_timezone: { type: string, description: For screens with no city. Each city has its own. }
                      service_open: { type: boolean }
                      map_style_url: { type: [string, "null"], format: uri }
                      features:
                        type: object
                        additionalProperties: false
                        required: [public_registration, live_dispatch, online_payments, rider_tracking]
                        properties:
                          public_registration: { type: boolean }
                          live_dispatch: { type: boolean }
                          online_payments: { type: boolean }
                          rider_tracking: { type: boolean }
                  meta: { $ref: "#/components/schemas/Meta" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/public/cities:
    get:
      tags: [Geography]
      summary: Cities where the service is open
      description: Active cities only. Empty until a city has been activated.
      operationId: publicCities
      security: []
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page of active cities, sorted by id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PublicCity" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/locations/serviceability:
    post:
      tags: [Geography]
      summary: Can this point be delivered to?
      description: |
        Polygon containment only: it does not check that a route exists. A
        point on a zone boundary is inside. `NO_ACTIVE_ZONE` means nothing is
        open anywhere; `OUTSIDE_COVERAGE` means zones exist but none covers
        the point. Limited to 60 requests a minute per address.

        This is a POST although it changes nothing: the position is personal
        data, and a query string is written to access logs by servers and
        proxies. A position sent in the URL is refused with 422, and the
        position is neither stored nor logged by the API (ADR-013). Browser
        clients send the usual `X-CSRF-TOKEN` header.
      operationId: serviceability
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [latitude, longitude]
              properties:
                latitude:
                  oneOf:
                    - { type: string, pattern: '^-?\d{1,3}(\.\d{1,12})?$' }
                    - { type: number, minimum: -90, maximum: 90 }
                  description: Decimal degrees, -90 to 90.
                longitude:
                  oneOf:
                    - { type: string, pattern: '^-?\d{1,3}(\.\d{1,12})?$' }
                    - { type: number, minimum: -180, maximum: 180 }
                  description: Decimal degrees, -180 to 180.
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Serviceability" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/admin/cities:
    get:
      tags: [Admin]
      summary: List cities the caller may read
      description: Admin app only. Filtered to the caller's scope; needs `cities.read`.
      operationId: adminCitiesIndex
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CityStatus" }
      responses:
        "200":
          description: One page of cities, sorted by id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/City" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      summary: Create a city
      description: Needs `cities.write` with global scope. The city starts as a draft; `status` and `id` in the request are ignored.
      operationId: adminCitiesStore
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, country_code, currency_code, timezone]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                slug: { type: string, maxLength: 160, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
                country_code: { type: string, pattern: "^[A-Z]{2}$" }
                currency_code: { type: string, description: Must equal the deployment currency. }
                timezone: { type: string, description: IANA name. Required; never defaulted. }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/cities/{city}:
    parameters:
      - name: city
        in: path
        required: true
        schema: { type: string }
        description: City id. Letter case is ignored.
    get:
      tags: [Admin]
      summary: One city
      description: 404 if it does not exist or the caller may not read it.
      operationId: adminCitiesShow
      responses:
        "200":
          description: The city.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Admin]
      summary: Edit a city or move its status
      description: |
        Needs `cities.write`. Only `name`, `timezone` and `status` can change.
        Status moves along: draft to active or archived; active to paused;
        paused to active or archived. Anything else, or any change to an
        archived city, is 409.
      operationId: adminCitiesUpdate
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                timezone: { type: string }
                status: { $ref: "#/components/schemas/CityStatus" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CityResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/cities/{city}/zones:
    parameters:
      - name: city
        in: path
        required: true
        schema: { type: string }
        description: City id. Letter case is ignored.
    get:
      tags: [Admin]
      summary: List a city's delivery zones
      description: Needs `zones.read` for the city; 404 otherwise. Geometry is left out of lists.
      operationId: adminZonesIndex
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page of zones, sorted by id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Zone" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      summary: Create a delivery zone
      description: |
        Needs `zones.write` for the city. The zone starts as a draft at
        version 1; `status`, `version` and `id` in the request are ignored.
        Geometry is checked for structure, the vertex and extent caps, and
        then by PostGIS for self-intersection. 409 if the city is archived.
      operationId: adminZonesStore
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, geometry]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                slug: { type: string, maxLength: 160, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", description: Unique within the city. }
                priority: { type: integer, minimum: -1000, maximum: 1000, default: 0 }
                geometry: { $ref: "#/components/schemas/ZoneGeometryInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/zones/{zone}:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
        description: Zone id. Letter case is ignored.
    get:
      tags: [Admin]
      summary: One delivery zone, with its geometry
      description: 404 if it does not exist or the caller may not read its city.
      operationId: adminZonesShow
      responses:
        "200":
          description: The zone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Admin]
      summary: Edit a delivery zone
      description: |
        Needs `zones.write` for the zone's city. Send the `version` you
        loaded; if the zone has changed since, the edit is refused with 409
        and nothing is written. Only `name`, `priority` and `geometry` can
        change; each successful edit adds 1 to `version`. Status has its own
        routes. Any change to an archived zone is 409.
      operationId: adminZonesUpdate
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                name: { type: string, minLength: 1, maxLength: 160 }
                priority: { type: integer, minimum: -1000, maximum: 1000 }
                geometry: { $ref: "#/components/schemas/ZoneGeometryInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/zones/{zone}/activate:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
        description: Zone id. Letter case is ignored.
    post:
      tags: [Admin]
      summary: Put a delivery zone live
      description: |
        Needs `zones.write` for the zone's city. Allowed from draft or paused,
        only while the city is active, and only with `confirm: true`. 409 for
        any other status, an inactive city or a stale `version`.
      operationId: adminZonesActivate
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, confirm]
              properties:
                version: { type: integer, minimum: 1 }
                confirm: { type: boolean, enum: [true] }
      responses:
        "200":
          description: The zone in its new status; `version` has gone up by 1.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/zones/{zone}/pause:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
        description: Zone id. Letter case is ignored.
    post:
      tags: [Admin]
      summary: Pause an active delivery zone
      description: |
        Needs `zones.write` for the zone's city. Allowed from active only; a
        reason is required. 409 for any other status or a stale `version`.
      operationId: adminZonesPause
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 255, description: Kept in the audit log. }
      responses:
        "200":
          description: The zone in its new status; `version` has gone up by 1.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/zones/{zone}/archive:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
        description: Zone id. Letter case is ignored.
    post:
      tags: [Admin]
      summary: Archive a delivery zone
      description: |
        Needs `zones.write` for the zone's city. Allowed from draft or paused;
        an active zone must be paused first. Archiving is final. 409 for any
        other status or a stale `version`.
      operationId: adminZonesArchive
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 255, description: Kept in the audit log. }
      responses:
        "200":
          description: The zone in its new status; `version` has gone up by 1.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/zones/{zone}/exclusions:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
        description: Zone id. Letter case is ignored.
    get:
      tags: [Admin]
      summary: List a zone's coverage exclusions
      description: Needs `zones.read` for the zone's city; 404 otherwise. Includes exclusions whose window has ended or not started.
      operationId: adminExclusionsIndex
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page of exclusions, sorted by id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Exclusion" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      summary: Exclude an area from a zone
      description: |
        Needs `zones.write` for the zone's city. Points inside the shape,
        its boundary included, stop being serviceable while the exclusion is
        in force: from `active_from` (or at once) until `active_until` (or
        until it is deleted). The shape gets the same checks as a zone and
        must overlap the zone. Exclusions are not edited: delete and add.
        409 if the zone is archived.
      operationId: adminExclusionsStore
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, geometry]
              properties:
                reason: { type: string, minLength: 1, maxLength: 255 }
                geometry: { $ref: "#/components/schemas/ZoneGeometryInput" }
                active_from: { type: [string, "null"], format: date-time, description: With an offset or Z. Stored in UTC. }
                active_until: { type: [string, "null"], format: date-time, description: Must be after `active_from`. }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Exclusion" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/exclusions/{exclusion}:
    parameters:
      - name: exclusion
        in: path
        required: true
        schema: { type: string }
        description: Exclusion id. Letter case is ignored.
    delete:
      tags: [Admin]
      summary: Remove a coverage exclusion
      description: Needs `zones.write` for the city of the exclusion's zone. The removal is audited with the reason and window.
      operationId: adminExclusionsDestroy
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{user}/mfa/reset:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: string }
        description: Id of a staff member. Letter case is ignored.
    post:
      tags: [Admin]
      summary: Reset a staff member's second factor
      description: |
        For a staff member who lost their authenticator and recovery codes.
        Needs `users.mfa.reset` (platform owner only) with global scope. 403
        when the target is the caller (use a recovery code instead) and when
        the target is a platform owner and the caller is not one. 404 for an
        unknown id or a user without a live staff grant. Deletes the factor
        and every recovery code in one transaction with the audit row
        `auth.mfa_reset` (reason and target id, never a code), and ends the
        person's stored sessions; any other session ends on its next
        request. They sign in with the password and must set up two-step
        sign-in again (deployed environments), or sign in with the password
        alone (local and testing).
      operationId: adminUsersMfaReset
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 255, description: "Why the reset was approved, for the audit trail. Never put a secret here." }
      responses:
        "204":
          description: Reset.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{user}/suspend:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: string }
        description: Id of a staff member. Letter case is ignored.
    post:
      tags: [Admin]
      summary: Suspend a staff account
      description: |
        Product owner decision 2026-11-14: only global administrators. Needs
        `users.suspend` through a GLOBAL grant (platform owner, platform
        admin); a city-scoped holder gets 403 whatever the target. 403 when
        the target is the caller, and when the target is a platform owner.
        404 for an unknown id, a user without a live staff grant, or when the
        caller cannot see them. 409 when the account is already suspended.
        Sets `users.status` to `suspended`, deletes the person's stored web
        sessions and rider bearer tokens, and writes the audit row
        `user.suspended` (reason included) in one transaction. Any other
        session ends on its next request. Pending invitations they sent can
        no longer be accepted.
      operationId: adminUsersSuspend
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, description: "Why the account is suspended, for the audit trail. Never put a secret here." }
      responses:
        "204":
          description: Suspended.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{user}/reactivate:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: string }
        description: Id of a staff member. Letter case is ignored.
    post:
      tags: [Admin]
      summary: Reactivate a suspended staff account
      description: |
        Same permission and visibility rules as suspend. 409 when the account
        is not suspended. Sets `users.status` back to `active` and writes the
        audit row `user.reactivated`. It does not restore sessions or rider
        tokens: the person signs in again.
      operationId: adminUsersReactivate
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500, description: "Optional note for the audit trail. Never put a secret here." }
      responses:
        "204":
          description: Reactivated.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: Staff members and their grants
      description: |
        Needs `users.read`. Lists people who hold a live staff role, by id,
        with the grants the caller may see: global reach sees every grant,
        city reach sees only grants anchored to those cities (so global
        grants and other cities are absent, not hidden). Support sees the
        address masked (`email_masked`). Accounts without a staff role are
        never listed. `can_revoke` says whether a revoke would be allowed; it
        is advice for the screen and the revoke request is checked in full.
      operationId: adminUsersIndex
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page of staff members, by id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StaffMember" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/roles:
    get:
      tags: [Admin]
      summary: Roles the caller may hand out, and where
      description: |
        Needs `users.read`. Lists only roles one of the caller's own grants
        is entitled to assign, with the scopes that grant covers: `global`
        (a deployment-wide grant), `all_cities`, or specific `city_ids`. The
        list is empty for a caller who may assign nothing. `platform_owner`
        and onboarding roles never appear. This only fills a form; the grant
        request is checked in full.
      operationId: adminRolesIndex
      responses:
        "200":
          description: Assignable roles.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AssignableRole" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{user}/roles:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: string }
        description: Id of a staff member the caller can see. Letter case is ignored.
    post:
      tags: [Admin]
      summary: Grant a role to a staff member
      description: |
        Needs `users.roles.assign`, and the caller must hold a role entitled
        to hand out the requested one over the same scope (ADR-005), so a
        city manager can grant only the dispatcher role in their own city.
        404 when the person is not a staff member within the caller's view
        (including a caller without `users.read`). 403 for a role or scope
        the caller may not hand out, for `platform_owner` and onboarding
        roles whoever asks, and for the caller's own account. 409 when the
        person already holds that role there or the account is not active.
        404 for a city that does not exist. Written with the audit row
        `role.granted` in one transaction. To bring in a
        person with no staff role yet, use `POST /admin/invitations`.
      operationId: adminUsersRolesStore
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, scope_type]
              properties:
                role: { type: string, maxLength: 40, description: "A role slug from `GET /admin/roles`." }
                scope_type: { type: string, enum: [global, city] }
                scope_id: { type: [string, "null"], description: "Required for `city`, forbidden for `global`." }
      responses:
        "201":
          description: Granted. Returns the person as the caller now sees them.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/StaffMember" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{user}/roles/{grant}:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: string }
      - name: grant
        in: path
        required: true
        schema: { type: string }
        description: Id of one of the person's grants, from `GET /admin/users`.
    delete:
      tags: [Admin]
      summary: Revoke a role from a staff member
      description: |
        Whoever could not have granted it cannot revoke it: needs
        `users.roles.assign` and an entitled role over the same scope. 404
        when the person or the grant is not within the caller's view, or the
        grant is not that person's. 403 for `platform_owner` (never
        revocable here) and for the caller's own grants. A person who loses
        their last staff role loses admin access on their next request.
        Written with the audit row `role.revoked` in one transaction.
      operationId: adminUsersRolesDestroy
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204":
          description: Revoked.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/invitations:
    get:
      tags: [Admin]
      summary: Pending staff invitations
      description: |
        Needs `users.read`. Lists invitations that are neither accepted,
        revoked nor expired, within the caller's reach (global reach sees all,
        city reach only those anchored to its cities). Never carries token
        data. The address is masked unless the caller could grant that role
        there. Oldest id first.
      operationId: adminInvitationsIndex
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of pending invitations.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StaffInvitation" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      summary: Invite a person to the admin team
      description: |
        Needs `users.roles.assign`, and the caller must be allowed to grant
        that role at that scope under the same rules as `POST
        /admin/users/{user}/roles` (ADR-005); staff roles only. 403 when not
        allowed (including `platform_owner`), 404 for a city that does not
        exist, 422 for an invalid field or an invitation to the caller's own
        address, 409 when a live invitation for that address, role and scope
        already exists, 429 after five invitation emails to one address in a
        day or twenty requests a minute. Always answers 202 with the same
        body, whether or not the address already has an account; no lookup
        is made. An email with a single-use link (token in the URL fragment)
        valid for 72 hours is sent to the address. Nothing is granted until
        the person accepts. Audit `staff_invitation.created`, without the
        address.
      operationId: adminInvitationsStore
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, role, scope_type]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                email: { type: string, maxLength: 255 }
                role: { type: string, maxLength: 40, description: "A staff role slug from `GET /admin/roles`." }
                scope_type: { type: string, enum: [global, city] }
                scope_id: { type: [string, "null"], description: "Required for `city`, forbidden for `global`." }
      responses:
        "202":
          description: Invitation recorded and emailed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [id, status]
                    properties:
                      id: { type: string }
                      status: { type: string, const: invitation_sent }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/admin/invitations/{invitation}:
    parameters:
      - name: invitation
        in: path
        required: true
        schema: { type: string }
        description: Id of a pending invitation from `GET /admin/invitations`. Letter case is ignored.
    delete:
      tags: [Admin]
      summary: Withdraw a pending invitation
      description: |
        Whoever could not have granted the role cannot withdraw the
        invitation: needs `users.read` to see it (404 otherwise, as for any
        invitation outside the caller's reach, or already accepted, revoked
        or expired) and then `users.roles.assign` with an entitled role over
        the same scope (403). Written with the audit row
        `staff_invitation.revoked`. The link stops working at once.
      operationId: adminInvitationsDestroy
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204":
          description: Withdrawn.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/audit-logs:
    get:
      tags: [Admin]
      summary: Audit trail, newest first
      description: |
        Needs `audit.read`. Staff holding it everywhere see every entry;
        staff holding it for certain cities see only entries tied to those
        cities. Sensitive values in `before` and `after` are redacted, and
        the address hash is never returned.
      operationId: adminAuditLogsIndex
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: action, in: query, schema: { type: string, maxLength: 120 }, description: Exact match. }
        - { name: subject_type, in: query, schema: { type: string, maxLength: 80 } }
        - { name: subject_id, in: query, schema: { type: string } }
        - { name: actor_user_id, in: query, schema: { type: string } }
        - { name: city_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/system/status:
    get:
      tags: [Admin]
      summary: Deployment status summary
      description: |
        Needs `system.status.read` with global scope. Dependency checks are
        up or down only. No secret, host name or connection detail is
        returned.
      operationId: adminSystemStatus
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [environment, debug, checks, postgis, cities, zones, features, map_style_configured, geometry_caps_approved]
                    properties:
                      environment: { type: string }
                      debug: { type: boolean, description: Must be false in production. }
                      checks:
                        type: object
                        additionalProperties: false
                        required: [database, redis]
                        properties:
                          database: { type: boolean }
                          redis: { type: boolean }
                      postgis: { type: boolean }
                      cities:
                        type: object
                        additionalProperties: false
                        required: [draft, active, paused, archived]
                        properties:
                          draft: { type: integer }
                          active: { type: integer }
                          paused: { type: integer }
                          archived: { type: integer }
                      zones:
                        type: object
                        additionalProperties: false
                        required: [draft, active, paused, archived]
                        properties:
                          draft: { type: integer }
                          active: { type: integer }
                          paused: { type: integer }
                          archived: { type: integer }
                      features:
                        type: object
                        additionalProperties: { type: boolean }
                      map_style_configured: { type: boolean }
                      geometry_caps_approved: { type: boolean }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
security:
  - sessionCookie: []
components:
  securitySchemes:
    riderToken:
      type: http
      scheme: bearer
      description: Rider app token from `POST /api/v1/auth/mobile/token`. Never valid on browser or admin routes.
    sessionCookie:
      type: apiKey
      in: cookie
      name: fd_customer_session
      description: The cookie is `fd_customer_session`, `fd_merchant_session` or `fd_admin_session` depending on the calling app.
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque value from `meta.next_cursor` of the previous page.
  headers:
    RequestId:
      description: Identifier of this request, also present in the body.
      schema: { type: string }
  responses:
    Error:
      description: Error envelope.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    RiderToken:
      type: object
      additionalProperties: false
      required: [token, token_type, abilities, expires_at]
      properties:
        token: { type: string, description: Shown once. Store it in the device keystore. }
        token_type: { type: string, const: Bearer }
        abilities:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }
    RiderTokenResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/RiderToken" }
        meta: { $ref: "#/components/schemas/Meta" }
    RiderProfile:
      type: object
      additionalProperties: false
      required: [id, user_id, name, email, status, approved_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [approved] }
        approved_at: { type: [string, "null"], format: date-time }
    PageMeta:
      type: object
      additionalProperties: false
      required: [request_id, next_cursor]
      properties:
        request_id: { type: string }
        next_cursor: { type: [string, "null"] }
    CityStatus:
      type: string
      enum: [draft, active, paused, archived]
    City:
      type: object
      additionalProperties: false
      required: [id, slug, name, country_code, currency_code, timezone, status, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^[0-9a-z]{26}$" }
        slug: { type: string }
        name: { type: string }
        country_code: { type: string }
        currency_code: { type: string }
        timezone: { type: string }
        status: { $ref: "#/components/schemas/CityStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CityResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/City" }
        meta: { $ref: "#/components/schemas/Meta" }
    ZoneGeometryInput:
      type: object
      required: [type, coordinates]
      description: GeoJSON Polygon or MultiPolygon, positions as [longitude, latitude]. Caps from config/geo.php.
      properties:
        type: { type: string, enum: [Polygon, MultiPolygon] }
        coordinates: { type: array, items: {} }
    Zone:
      type: object
      additionalProperties: false
      required: [id, city_id, name, slug, status, priority, version, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^[0-9a-z]{26}$" }
        city_id: { type: string, pattern: "^[0-9a-z]{26}$" }
        name: { type: string }
        slug: { type: string }
        status: { $ref: "#/components/schemas/CityStatus" }
        priority: { type: integer }
        version: { type: integer, minimum: 1 }
        geometry:
          type: object
          description: GeoJSON MultiPolygon. Present on single-zone responses only.
          required: [type, coordinates]
          properties:
            type: { type: string, enum: [MultiPolygon] }
            coordinates: { type: array, items: {} }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ZoneResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Zone" }
        meta: { $ref: "#/components/schemas/Meta" }
    Exclusion:
      type: object
      additionalProperties: false
      required: [id, zone_id, reason, active_from, active_until, geometry, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^[0-9a-z]{26}$" }
        zone_id: { type: string, pattern: "^[0-9a-z]{26}$" }
        reason: { type: string }
        active_from: { type: [string, "null"], format: date-time }
        active_until: { type: [string, "null"], format: date-time }
        geometry:
          type: object
          description: GeoJSON MultiPolygon.
          required: [type, coordinates]
          properties:
            type: { type: string, enum: [MultiPolygon] }
            coordinates: { type: array, items: {} }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StaffGrant:
      type: object
      additionalProperties: false
      required: [id, role, role_label, scope_type, scope_id, city_name, granted_at, can_revoke]
      properties:
        id: { type: string }
        role: { type: string }
        role_label: { type: string }
        scope_type: { type: string, enum: [global, city] }
        scope_id: { type: [string, "null"] }
        city_name: { type: [string, "null"], description: Name of the city for a city grant. }
        granted_at: { type: string, format: date-time }
        can_revoke: { type: boolean }
    StaffMember:
      type: object
      additionalProperties: false
      required: [id, name, email, email_masked, status, mfa_enrolled, is_self, can_suspend, can_reactivate, grants]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, description: "Masked (first letter, then asterisks) when `email_masked` is true." }
        email_masked: { type: boolean }
        status: { type: string, enum: [active, suspended] }
        mfa_enrolled: { type: boolean }
        is_self: { type: boolean }
        can_suspend: { type: boolean, description: "True when the caller may suspend this active account (global `users.suspend`, not themselves, not a platform owner)." }
        can_reactivate: { type: boolean, description: "True when the caller may reactivate this suspended account." }
        grants:
          type: array
          items: { $ref: "#/components/schemas/StaffGrant" }
    StaffInvitation:
      type: object
      additionalProperties: false
      required: [id, name, email, email_masked, role, role_label, scope_type, scope_id, city_name, invited_by_me, created_at, expires_at, can_revoke]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, description: "Masked (first letter, then asterisks) when `email_masked` is true." }
        email_masked: { type: boolean }
        role: { type: string }
        role_label: { type: string }
        scope_type: { type: string, enum: [global, city] }
        scope_id: { type: [string, "null"] }
        city_name: { type: [string, "null"] }
        invited_by_me: { type: boolean }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        can_revoke: { type: boolean }
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [name, role_label, scope_label, expires_at]
      properties:
        name: { type: string }
        role_label: { type: string }
        scope_label: { type: string, description: "The city's name, or `All cities` for a deployment-wide role." }
        expires_at: { type: string, format: date-time }
    AssignableRole:
      type: object
      additionalProperties: false
      required: [slug, label, scope_types, global, all_cities, city_ids]
      properties:
        slug: { type: string }
        label: { type: string }
        scope_types:
          type: array
          items: { type: string, enum: [global, city] }
        global: { type: boolean, description: The caller may grant it deployment-wide. }
        all_cities: { type: boolean, description: The caller may grant it in any city. }
        city_ids:
          type: array
          items: { type: string }
          description: Cities where the caller may grant it, when not all.
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, actor_user_id, action, subject_type, subject_id, city_id, before, after, correlation_id, created_at]
      properties:
        id: { type: string }
        actor_user_id: { type: [string, "null"], description: Null for actions taken by the system. }
        action: { type: string }
        subject_type: { type: string }
        subject_id: { type: [string, "null"] }
        city_id: { type: [string, "null"] }
        before: { type: [object, "null"] }
        after: { type: [object, "null"] }
        correlation_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    PublicCity:
      type: object
      additionalProperties: false
      required: [id, name, country_code, currency_code, timezone]
      properties:
        id: { type: string }
        name: { type: string }
        country_code: { type: string }
        currency_code: { type: string }
        timezone: { type: string }
    NamedRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Serviceability:
      type: object
      additionalProperties: false
      required: [serviceable, reason, city, zone]
      properties:
        serviceable: { type: boolean }
        reason: { type: [string, "null"], enum: [NO_ACTIVE_ZONE, OUTSIDE_COVERAGE, null] }
        city:
          oneOf: [{ $ref: "#/components/schemas/NamedRef" }, { type: "null" }]
        zone:
          oneOf: [{ $ref: "#/components/schemas/NamedRef" }, { type: "null" }]
    Meta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: { type: string }
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, unavailable] }
        checks:
          type: object
          additionalProperties: false
          required: [database, redis]
          properties:
            database: { type: boolean }
            redis: { type: boolean }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, AUTH_REQUIRED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, RATE_LIMITED, PROVIDER_UNAVAILABLE, BAD_REQUEST, SERVER_ERROR]
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            request_id: { type: string }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, name, email, email_verified, mfa_enabled, surface, grants]
      properties:
        id: { type: string, pattern: "^[0-9a-z]{26}$" }
        name: { type: string }
        email: { type: string }
        email_verified: { type: boolean }
        mfa_enabled: { type: boolean }
        surface: { type: string, enum: [customer, merchant, admin] }
        grants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, scope_type, scope_id, permissions]
            properties:
              role: { type: string }
              scope_type: { type: string, enum: [global, city, merchant, branch] }
              scope_id: { type: [string, "null"] }
              permissions:
                type: array
                items: { type: string }
    MfaRequiredResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [mfa_required]
          properties:
            mfa_required: { type: boolean, const: true }
        meta: { $ref: "#/components/schemas/Meta" }
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/CurrentUser" }
        meta: { $ref: "#/components/schemas/Meta" }
