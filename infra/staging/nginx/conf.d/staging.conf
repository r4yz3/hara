# Edge reverse proxy for staging (backlog E-07). Cloudflare terminates the
# visitor's TLS and re-encrypts to this server (SSL mode Full (strict)) with a
# Cloudflare Origin Certificate mounted at /etc/hara/certs. Cloudflare's ranges
# and the real-client-IP rules are in cloudflare.conf (generated).
#
# The Docker network is fixed at 172.31.77.0/24 (compose.yaml); its gateway,
# 172.31.77.1, is the address host-side curl tests arrive from.

# The path without the query string, never a body (ADR-013); same shape as the
# API's own nginx log. $remote_addr is already the real client (realip).
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}
log_format edge '$remote_addr [$time_iso8601] $host "$request_method $request_path" $status '
                '$body_bytes_sent $request_time "$http_x_request_id"';
access_log /dev/stdout edge;

# Docker's embedded DNS, so a recreated container (a rollback, a new release)
# is found again without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;
client_max_body_size 2m;
limit_req_zone $binary_remote_addr zone=hara_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hara_web:10m rate=30r/s;
limit_req_status 429;

# Plain HTTP: redirect to HTTPS. Cloudflare's "Always Use HTTPS" normally
# does this before the request reaches the server.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    if ($hara_trusted_peer = 0) { return 444; }
    location = /nginx-health { access_log off; default_type text/plain; return 200 ok; }
    location / { return 301 https://$host$request_uri; }
}

# Any other host name, or a request that did not come through Cloudflare:
# close the connection without an answer. ssl_reject_handshake needs no certificate.
server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Shared TLS settings.
ssl_certificate     /etc/hara/certs/origin.pem;
ssl_certificate_key /etc/hara/certs/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:hara_ssl:5m;
ssl_session_timeout 1h;
ssl_session_tickets off;

# ---- Web apps (Next.js) ----
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name staging.haradelivery.com;
    set $upstream http://customer:3000;
    include /etc/nginx/conf.d/snippets/web-proxy.inc;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name staging-merchant.haradelivery.com;
    set $upstream http://merchant:3001;
    include /etc/nginx/conf.d/snippets/web-proxy.inc;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name staging-admin.haradelivery.com;
    set $upstream http://admin:3002;
    include /etc/nginx/conf.d/snippets/web-proxy.inc;
}

# ---- API (Laravel behind the ADR-014 `web` nginx) ----
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name staging-api.haradelivery.com;
    if ($hara_trusted_peer = 0) { return 444; }

    limit_req zone=hara_api burst=40 nodelay;

    # /health/ready is for the host only (the API refuses public addresses
    # too); do not expose it through the proxy at all.
    location = /health/ready { return 404; }

    location / {
        set $upstream http://web:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the client cannot add its own entries.
        # The API trusts only this proxy's subnet (TRUSTED_PROXIES).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Connection "";
        proxy_read_timeout 35s;
    }
}
