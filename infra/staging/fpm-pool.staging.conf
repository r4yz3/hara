; PHP-FPM pool for staging on an 8 GB host (replaces the image's zz-app.conf;
; compose.yaml mounts it read-only). Same as infra/docker/prod/fpm-pool.conf
; except for the worker counts: 6 workers x memory_limit 256M is a 1.5 GB ceiling,
; which fits the api container's memory limit.
[www]
listen = 9000
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 1000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
access.log = /dev/null

[global]
error_log = /proc/self/fd/2
