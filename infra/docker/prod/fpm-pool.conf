; PHP-FPM pool overrides (E-05). The image already runs FPM as www-data.
[www]
listen = 9000
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
; The container environment (database, keys) must reach PHP.
clear_env = no
; Errors go to the container log, not to the response.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
; nginx already logs each request; the image's default FPM access log would
; log each one twice, as GET /index.php.
access.log = /dev/null

[global]
error_log = /proc/self/fd/2
