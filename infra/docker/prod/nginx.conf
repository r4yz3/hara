# nginx in front of PHP-FPM (E-05, ADR-014). TLS is terminated before this,
# at the host's proxy or load balancer, which must set X-Forwarded-Proto.

# The path the client asked for, with the query string cut off, and never a
# request body (ADR-013). $uri would show /index.php for every request after
# the internal rewrite, and $request_uri would include the query string.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}
log_format app '$remote_addr [$time_iso8601] "$request_method $request_path" $status '
               '$body_bytes_sent $request_time "$http_x_request_id"';

server {
    listen 8080;
    server_name _;
    root /var/www/backend/public;

    access_log /dev/stdout app;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 2m;

    # Hidden files are never served.
    location ~ /\. { return 404; }

    location = /favicon.ico { access_log off; }
    location = /robots.txt  { access_log off; }

    # Everything else goes to the Laravel front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 30s;
    }

    # Any other .php path is not code to run.
    location ~ \.php$ { return 404; }
}
