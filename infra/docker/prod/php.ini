; Production overrides on top of php.ini-production (E-05).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
memory_limit = 256M
; Zone shapes are the largest bodies (5,000 vertices is well under 1 MB).
post_max_size = 2M
upload_max_filesize = 0
file_uploads = Off
max_execution_time = 30
session.use_strict_mode = 1

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
